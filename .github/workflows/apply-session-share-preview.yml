name: Apply session share preview

on:
  push:
    branches:
      - release/v1.0.1-polish
    paths:
      - scripts/apply_session_share_preview.py
      - .github/workflows/apply-session-share-preview.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.1-polish
          fetch-depth: 0

      - name: Apply session UI changes
        run: python3 scripts/apply_session_share_preview.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: share and preview individual sessions"
          git push origin HEAD:release/v1.0.1-polish
