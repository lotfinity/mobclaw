name: Apply v1.0.1 polish

on:
  push:
    branches:
      - release/v1.0.1-polish
    paths:
      - scripts/apply_v101_polish.py
      - .github/workflows/apply-v101-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.1-polish
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/apply_v101_polish.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: polish MobClaw v1.0.1 prompt flow and UI"
          git push origin HEAD:release/v1.0.1-polish
