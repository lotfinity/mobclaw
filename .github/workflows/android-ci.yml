name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/visual-screen-observation

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile MobClaw and test app
        id: compile
        shell: bash
        run: |
          set +e
          ./gradlew :mobclaw:compileDebugKotlin :app:compileDebugKotlin --console=plain > compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 compile.log
          exit 0

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-log
          path: compile.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on compiler error
        if: steps.compile.outputs.status != '0'
        run: exit 1
